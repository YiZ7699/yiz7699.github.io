short_bio: >-
  <p>
    I am a Ph.D. student in Computer Science at the
    University of Southern California. My research focuses on
    designing scalable algorithms for complex planning, optimization, and
    resource-allocation problems.
  </p>

  <p>
    My current work develops efficient and scalable algorithms for <strong>Multi-Agent Path Finding</strong> and <strong>Virtual Network Embedding</strong>. 
    These problems involve coordinating multiple agents, allocating limited resources, and finding feasible paths under complex constraints. 
    My recent research applies AI, search, and optimization techniques to large-scale planning, coordination, and resource allocation problems.
    I am also interested in translating algorithmic research into practical systems for robotics, autonomous agents, and large-scale network optimization.
  </p>

  <p>
    <strong>Research interests:</strong><br>
    Artificial Intelligence · Search &amp; Planning · Multi-Agent Systems · Motion Planning ·
    Combinatorial Optimization · Resource Allocation 
  </p>

